name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches-ignore:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x", latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@{{ matrix.node-version }}
          cache: true

  results:
    name: CI Results
    if: github.event_name == 'pull_request'
    needs: ci
    uses: LexBorisoff/workflows/.github/workflows/ci-results.yml@main
    with:
      ci-result: ${{ needs.ci.result }}
